name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

  docker:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t sanjeevputhineedi/automated-cicd-webapp:latest .

      - name: Push Docker image
        run: docker push sanjeevputhineedi/automated-cicd-webapp:latest
          deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull latest Docker image
        run: docker pull sanjeevputhineedi/automated-cicd-webapp:latest

      - name: Stop old container
        run: docker stop automated-cicd-container || true

      - name: Remove old container
        run: docker rm automated-cicd-container || true

      - name: Run new container
        run: |
          docker run -d \
            --name automated-cicd-container \
            -p 4000:4000 \
            sanjeevputhineedi/automated-cicd-webapp:latest